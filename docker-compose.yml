services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lista-zakupow-app
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lista-zakupow

  nginx:
    image: nginx:alpine
    container_name: lista-zakupow-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - lista-zakupow

  db:
    image: postgres:16-alpine
    container_name: lista-zakupow-db
    environment:
      POSTGRES_DB: lista_zakupow
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d lista_zakupow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lista-zakupow

volumes:
  db-data:

networks:
  lista-zakupow:
    driver: bridge
